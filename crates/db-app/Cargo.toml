[package]
name = "db-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anlg-cloudsync = { workspace = true, optional = true }
anlg-db-core = { workspace = true, default-features = false }
anlg-db-migrate = { workspace = true, default-features = false }
anlg-e2ee = { workspace = true }

base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "macros"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[features]
default = ["cloudsync"]
cloudsync = ["dep:anlg-cloudsync", "anlg-db-core/cloudsync", "anlg-db-migrate/cloudsync"]
cli = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[package]
name = "db-migrate"
version = "0.1.0"
edition = "2024"

[features]
default = ["cloudsync"]
cloudsync = ["anlg-db-core/cloudsync"]

[dependencies]
anlg-db-core = { workspace = true, default-features = false }

sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "sqlite-unbundled", "migrate"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

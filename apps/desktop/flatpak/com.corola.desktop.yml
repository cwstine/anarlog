# Flatpak manifest for Corola.
# Flatpak remains an internal candidate until the sandboxed audio, credentials,
# and desktop-integration release gates in ANLG-169 pass.

id: com.corola.desktop

runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: corola

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=~/.local/bin:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --own-name=com.corola.desktop
  - --env=FLATPAK=1

build-options:
  append-path: /usr/lib/sdk/llvm21/bin:/usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin:/run/build/corola/pnpm-cli/bin
  env:
    CARGO_HOME: /run/build/corola/cargo
    CARGO_NET_OFFLINE: "true"
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    ORT_LIB_LOCATION: /run/build/corola/flatpak-onnxruntime/lib
    npm_config_nodedir: /usr/lib/sdk/node24
    npm_config_offline: "true"
    XDG_CACHE_HOME: /run/build/corola/cache

modules:
  - name: corola
    buildsystem: simple

    sources:
      - type: dir
        path: ../../..
        skip:
          - .cache
          - .git
          - .netlify
          - .supabase
          - .tmp
          - .turbo
          - .venv
          - node_modules
          - target
          - "*/node_modules"
          - "*/*/node_modules"
          - "*/*/*/node_modules"
          - "*/target"
          - "*/*/target"
          - "*/*/*/target"
          - "*/.build"
          - "*/*/.build"
          - "*/*/*/.build"
      - pnpm-sources.json
      - cargo-sources.json
      - type: archive
        url: https://cdn.pyke.io/0/pyke:ort-rs/ms@1.22.0/aarch64-unknown-linux-gnu.tgz
        sha256: 24e4760207136fc50b854bb5012ab81de6189039cf6d4fd3f5b8d3db7e929f1e
        dest: flatpak-onnxruntime
        only-arches:
          - aarch64
      - type: archive
        url: https://cdn.pyke.io/0/pyke:ort-rs/ms@1.22.0/x86_64-unknown-linux-gnu.tgz
        sha256: ed1716de95974bf47ab0223ca33734a0b5a5d09a181225d0e8ed62d070aea893
        dest: flatpak-onnxruntime
        only-arches:
          - x86_64
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.1.1.tgz
        sha256: 05b282d06332295c736f0b20c8bdf185325bf1bca682c91ed81154a3c6851cc0
        dest-filename: pnpm-11.1.1.tgz

    build-commands:
      - npm install --offline --global --prefix=/run/build/corola/pnpm-cli ./pnpm-11.1.1.tgz
      - pnpm install --offline --frozen-lockfile
      - cargo build --locked --offline --release -p corola-cli
      - pnpm -F desktop tauri build --no-bundle --config src-tauri/tauri.conf.flatpak.json
      - install -Dm755 apps/desktop/src-tauri/target/release/corola /app/bin/corola
      - install -Dm755 target/release/corola /app/libexec/corola-cli
      - install -Dm755 apps/desktop/flatpak/corola-cli /app/bin/corola-cli
      - install -Dm644 apps/desktop/flatpak/com.corola.desktop.desktop /app/share/applications/com.corola.desktop.desktop
      - install -Dm644 apps/desktop/flatpak/com.corola.desktop.metainfo.xml /app/share/metainfo/com.corola.desktop.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/stable/32x32.png /app/share/icons/hicolor/32x32/apps/com.corola.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/stable/64x64.png /app/share/icons/hicolor/64x64/apps/com.corola.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/stable/128x128.png /app/share/icons/hicolor/128x128/apps/com.corola.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/stable/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.corola.desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/stable/icon.png /app/share/icons/hicolor/512x512/apps/com.corola.desktop.png
